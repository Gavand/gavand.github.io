# Creates a PAID service with persistent storage. Review billing before applying.
services:
  - type: web
    name: andbotics-hq
    runtime: docker
    plan: starter
    dockerfilePath: .hq-app/Dockerfile
    dockerContext: .hq-app
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: hq-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HQ_AUTH_CONFIG
        sync: false
      - key: HQ_PUBLIC_ORIGIN
        value: https://hq.andbotics.com
      - key: HQ_DATABASE
        value: /var/data/hq.sqlite3
      - key: HQ_REFERENCE_DIR
        value: /var/data/references
      - key: HQ_BIND
        value: 0.0.0.0
