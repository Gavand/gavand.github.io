<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andbotics HQ</title><link rel="stylesheet" href="/hq/style.css"></head><body>
<aside><a class="brand" href="/hq/"><img src="/hq/logo.jpg" alt="Andbotics logo"><span>ANDBOTICS<span class="hq">HQ</span></span></a><div class="workspace">A <span>Andbotics workspace<small>Business operations</small></span></div><div class="navlabel">WORKSPACE</div><nav><button data-page="dashboard" class="active">◫ <span>Overview</span></button><button data-page="crm">▦ <span>CRM & pipeline</span></button><button data-page="agents">✧ <span>AI workflows</span></button><button data-page="approvals">☑ <span>Approval queue</span><b id="queueCount">0</b></button><button data-page="sources">▤ <span>Business sources</span></button><button data-page="finances">＄ <span>Finance & materials</span></button><button data-page="integrations">⇄ <span>Integrations</span></button></nav><div class="sidebottom"><div class="guard">◉ Approval protected<small>Every outreach draft needs review.</small></div><div class="profile">G <span>Workspace owner<small>Local workspace</small></span></div></div></aside>
<main><header><div>Workspace <span>/</span> <strong id="crumb">Overview</strong></div><div class="header-right"><span class="local">● Local MVP</span><button class="link" id="logout">Sign out</button><span class="avatar">A</span></div></header><section id="content"></section></main>
<dialog id="leadDialog"><form id="leadForm"><div class="dialoghead"><h2 id="leadTitle">New lead</h2><button type="button" id="closeDialog" class="icon">×</button></div><input type="hidden" name="id"><label>Company<input name="company" required maxlength="160"></label><div class="formrow"><label>Contact name<input name="contact"></label><label>Email<input name="email" type="email"></label></div><div class="formrow"><label>Sector<input name="sector"></label><label>Opportunity value ($)<input name="value" type="number" min="0" value="0" required></label></div><label>Pipeline stage<select name="stage"><option>Not Contacted</option><option>Sent</option><option>Discovery</option><option>Pilot Agreed</option><option>Dead</option><option>Qualified</option><option>Proposal</option><option>Won</option></select></label><div class="formrow"><label>Location<input name="location"></label><label>Phone<input name="phone"></label></div><div class="formrow"><label>Date emailed<input name="date_emailed"></label><label>Date called<input name="date_called"></label></div><div class="formrow"><label>Follow-up date<input name="followup"></label><label>Purpose<input name="reason"></label></div><p id="recordSource" class="demo"></p><label>Notes<textarea name="notes" rows="4"></textarea></label><button class="primary" type="submit">Save lead</button></form></dialog><div id="toast" role="status"></div><script src="/hq/app.js"></script></body></html>
